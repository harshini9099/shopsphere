services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: shopsphere
      POSTGRES_USER: shopsphere
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-demo-password}
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shopsphere -d shopsphere"]
      interval: 5s
      timeout: 5s
      retries: 20
  backend:
    build: ./backend
    environment:
      DB_URL: jdbc:postgresql://db:5432/shopsphere
      DB_USER: shopsphere
      DB_PASSWORD: ${POSTGRES_PASSWORD:-local-demo-password}
    ports: ["127.0.0.1:8080:8080"]
    depends_on:
      db: { condition: service_healthy }
    healthcheck:
      test:
        ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/api/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports: ["127.0.0.1:5173:80"]
    depends_on:
      backend: { condition: service_healthy }
volumes:
  pgdata:
